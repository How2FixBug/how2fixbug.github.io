<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects | How2FixBug</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="projects.css">
  </head>
  <body>
    <header class="topbar">
      <a href="/Home/" class="logo">How2FixBug</a>
      <nav class="topbar-links">
        <a href="/Home/">Home</a>
        <a href="/About/">About</a>
        <a href="/Projects/">Projects</a>
      </nav>
      <p id="view-count">Loading views...</p>
    </header>

    <main class="projects-page">
      <h1 id="about-text">Projects</h1>
      <section id="project-list" class="project-list" aria-label="My projects"></section>
    </main>

    <script data-goatcounter="https://how2fixbug.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <script>
      fetch('https://how2fixbug.goatcounter.com/counter/TOTAL.json')
        .then(response => response.json())
        .then(data => {
          document.getElementById('view-count').textContent = data.count + ' Views';
        })
        .catch(() => {
          document.getElementById('view-count').textContent = 'Views unavailable';
        });
    </script>
    <script src="projects.js"></script>
  </body>
</html>
