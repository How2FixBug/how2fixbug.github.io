<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Earn BugBucks by exploring How2FixBug, then spend them on rewards.">
    <title>BugBucks | How2FixBug</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/rewards.css">
    <script src="/economy.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="logo">How2FixBug</a>
      <nav class="topbar-links" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/rewards" aria-current="page">Rewards</a>
      </nav>
      <p id="view-count">Loading views...</p>
      <div class="topbar-stats">
        <span id="bugbucks-balance">0 BB</span>
      </div>
    </header>

    <main class="rewards-page">
      <section class="rewards-hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">BugBucks</h1>
        </div>
        <div class="wallet-card">
          <span class="wallet-label">WALLET</span>
          <strong id="wallet-balance">0 BB</strong>
        </div>
      </section>

      <nav class="section-jump" aria-label="Rewards sections">
        <a href="#quests">Quests</a>
        <a href="#shop">Shop</a>
        <a href="#achievements">Achievements</a>
      </nav>

      <section class="rewards-section" id="quests">
        <div class="section-heading">
          <h2>Quests</h2>
        </div>
        <div id="quest-list" class="card-grid" aria-live="polite">Loading quests...</div>
      </section>

      <section class="rewards-section" id="shop">
        <div class="section-heading">
          <h2>Shop</h2>
        </div>
        <div id="shop-list" class="card-grid" aria-live="polite">Loading shop...</div>
      </section>

      <section class="rewards-section" id="achievements">
        <div class="section-heading">
          <h2>Achievements</h2>
        </div>
        <div id="achievement-list" class="card-grid" aria-live="polite">Loading achievements...</div>
      </section>

    </main>

    <script data-goatcounter="https://how2fixbug.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <script>
      fetch('https://how2fixbug.goatcounter.com/counter/TOTAL.json')
        .then(response => response.json())
        .then(data => {
          document.getElementById('view-count').textContent = data.count + ' Views';
        })
        .catch(() => {
          document.getElementById('view-count').textContent = 'Views unavailable';
        });
    </script>
  </body>
</html>
