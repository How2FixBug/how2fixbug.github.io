<!DOCTYPE html>
<html>
  <head>
    <title>BugBucks | How2FixBug</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="/rewards.css">
    <script src="/economy.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="logo">How2FixBug</a>
      <nav class="topbar-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/rewards.html">Rewards</a>
      </nav>
      <p id="view-count">Loading views...</p>
      <div class="topbar-stats">
        <span id="bugbucks-balance">0 BB</span>
      </div>
    </header>

    <main class="rewards-page">
      <header class="rewards-header">
        <h1>BugBucks</h1>
        <p>Earn them around the site. Spend them here.</p>
        <div class="wallet-line">Wallet: <strong id="wallet-balance">0 BB</strong></div>
      </header>

      <section class="rewards-section">
        <h2>Quests</h2>
        <div id="quest-list" class="card-grid">Loading quests...</div>
      </section>

      <section class="rewards-section">
        <h2>Shop</h2>
        <div id="shop-list" class="card-grid">Loading shop...</div>
      </section>

      <section class="rewards-section">
        <h2>Achievements</h2>
        <div id="achievement-list" class="card-grid">Loading achievements...</div>
      </section>

      <p class="fine-print">BugBucks are site points, not real money. Your balance is saved in this browser.</p>
    </main>

    <script data-goatcounter="https://how2fixbug.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <script>
      fetch('https://how2fixbug.goatcounter.com/counter/TOTAL.json')
        .then(response => response.json())
        .then(data => {
          document.getElementById('view-count').textContent = data.count + ' Views';
        })
        .catch(() => {
          document.getElementById('view-count').textContent = 'Views unavailable';
        });
    </script>
  </body>
</html>
